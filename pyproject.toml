[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "carbondivi-errcluster"
version = "0.1.0"
description = "按错误信息的结构特征聚类，给出每类的数量与代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "carbondivi" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://carbondivi.github.io"
Repository = "https://github.com/carbondivi/errcluster"
Issues = "https://github.com/carbondivi/errcluster/issues"

[project.scripts]
errcluster = "errcluster:main"

[tool.setuptools]
py-modules = ["errcluster"]
